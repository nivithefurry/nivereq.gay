<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Manager — nivereq</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7f7;--surface:rgba(255,255,255,.84);--surface-solid:#fff;--text:#202725;--muted:#747e7a;--accent:#33877e;--accent-strong:#246d65;--accent-soft:#e3f1ee;--rose:#d98192;--border:rgba(37,55,50,.1);--border-strong:rgba(37,55,50,.16);--shadow-soft:0 18px 56px rgba(28,45,41,.065);--shadow-card:0 5px 20px rgba(28,45,41,.035)}
    [data-theme="dark"]{color-scheme:dark;--bg:#111715;--surface:rgba(31,40,37,.86);--surface-solid:#202925;--text:#eef3f0;--muted:#a1ada7;--accent:#80c6b9;--accent-strong:#9ad7ca;--accent-soft:#263b35;--rose:#e19baa;--border:rgba(230,243,236,.1);--border-strong:rgba(230,243,236,.18);--shadow-soft:0 18px 56px rgba(0,0,0,.23);--shadow-card:0 5px 20px rgba(0,0,0,.12)}
    *{box-sizing:border-box}html{min-width:320px}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 90% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 34rem),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;transition:background-color 260ms ease,color 260ms ease}.wrap{width:min(1120px,calc(100% - 48px));margin:0 auto 64px}.site-header{position:sticky;z-index:5;top:0;display:flex;align-items:center;justify-content:space-between;min-height:76px;margin-bottom:clamp(42px,8vw,86px);border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(150%)}.wordmark{color:var(--text);font-size:1rem;font-weight:750;letter-spacing:-.055em;text-decoration:none}.wordmark span{color:var(--accent);font-size:.7em}.header-tools,.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.local-label{padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.76rem}.icon-button{display:grid;width:42px;height:42px;place-items:center;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:1.05rem;cursor:pointer;transition:transform 160ms ease,background 160ms ease,border-color 160ms ease}.icon-button:hover{transform:translateY(-1px);border-color:var(--border-strong);background:var(--surface-solid)}.intro{margin-bottom:30px}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--accent-strong);font-size:.72rem;font-weight:700;letter-spacing:.115em;text-transform:uppercase}.eyebrow:before{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);content:""}.intro h1{margin:14px 0 0;font-size:clamp(2.4rem,6vw,4rem);font-weight:720;letter-spacing:-.075em;line-height:1}.intro p{max-width:600px;margin:14px 0 0;color:var(--muted);font-size:.98rem;line-height:1.7}.panel{margin-bottom:20px;padding:clamp(18px,3vw,28px);border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-card);backdrop-filter:blur(16px)}h2{margin:0;font-size:1.2rem;font-weight:680;letter-spacing:-.035em}p{color:var(--muted);margin:.4rem 0 0}.hint{font-size:.88rem}.toolbar{margin-bottom:20px}.toolbar span{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}button,input{font:inherit;color:inherit}button{min-height:42px;padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--surface-solid);cursor:pointer;transition:transform 160ms ease,background 160ms ease,border-color 160ms ease,box-shadow 160ms ease}button:hover{transform:translateY(-1px);border-color:var(--border-strong);box-shadow:var(--shadow-card)}button:active{transform:translateY(0) scale(.985)}button.primary{border-color:#273b37;background:#273b37;color:#fff;font-weight:650}button.primary:hover{background:#172b27}[data-theme="dark"] button.primary{border-color:#dce9e3;background:#dce9e3;color:#1b2924}[data-theme="dark"] button.primary:hover{background:#fff}button.danger{color:#ad596b}label{display:block;margin:0 0 7px;color:var(--muted);font-size:.86rem;font-weight:600}input{width:100%;min-height:46px;margin-bottom:15px;padding:10px 14px;border:1px solid var(--border-strong);border-radius:14px;background:var(--surface-solid);transition:border-color 160ms ease,box-shadow 160ms ease}input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:20px}form .wide{grid-column:1/-1}.message{min-height:1.5em;margin:10px 0 0;color:var(--accent-strong);white-space:pre-line}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{overflow:hidden;border:1px solid var(--border);border-radius:20px;background:var(--surface);box-shadow:var(--shadow-card);transition:transform 180ms ease,border-color 180ms ease,box-shadow 180ms ease}.card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-soft)}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--accent-soft)}.meta{padding:15px}.meta strong{display:block;overflow-wrap:anywhere;font-size:.94rem;font-weight:650}.meta small{display:block;margin-top:5px;color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}.meta .actions{justify-content:flex-start;margin-top:14px}.empty{grid-column:1/-1;padding:34px 20px;border:1px dashed var(--border-strong);border-radius:18px;color:var(--muted);text-align:center}.footer{padding:24px 0;border-top:1px solid var(--border);color:var(--muted);font-size:.78rem;text-align:center}
    @media(max-width:620px){.wrap{width:calc(100% - 32px)}.site-header{min-height:66px;margin-bottom:40px}.local-label{display:none}.panel{padding:17px;border-radius:20px}form{grid-template-columns:1fr}form .wide{grid-column:auto}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .actions{width:100%;flex-wrap:wrap}.toolbar .actions button{flex:1}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.meta{padding:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="site-header"><a class="wordmark" href="/">nivereq<span>.</span></a><div class="header-tools"><span class="local-label">Private local tool</span><button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button></div></header>
  <section class="intro"><span class="eyebrow">Creator dashboard</span><h1>Art Manager</h1><p>Manage your artwork and gallery data. Changes appear on the website after you export.</p></section>
  <section class="panel" aria-labelledby="add-title">
    <h2 id="add-title">Add artwork</h2>
    <p class="hint">Enter the path to a local image. Supported formats: PNG, JPEG, GIF, WebP; 25 MB maximum.</p>
    <form id="add-form">
      <div class="wide"><label for="sourcePath">Absolute file path</label><input id="sourcePath" name="sourcePath" required placeholder="/home/user/artworks/example.png"></div>
      <div><label for="author">Artist / author</label><input id="author" name="author" required maxlength="120"></div>
      <div><label for="createdAt">Creation date (optional)</label><input id="createdAt" name="createdAt" type="date"></div>
      <div class="wide"><button class="primary" type="submit">Add to gallery</button></div>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </section>
  <section class="panel">
    <div class="toolbar"><div><h2>Artwork</h2><span id="count"></span></div><div class="actions"><button id="refresh">Refresh list</button><button id="import">Import arts.json</button><button id="backup">Back up now</button><button id="export" class="primary">Export to website</button></div></div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </section>
  <footer class="footer">nivereq · local art manager</footer>
</main>
<script>
try{const savedTheme=localStorage.getItem('theme');if(savedTheme==='dark'||(!savedTheme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch{}
const $=s=>document.querySelector(s), grid=$('#grid'), message=$('#message');
$('#theme-toggle').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';if(dark)document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;try{localStorage.setItem('theme',dark?'dark':'light')}catch{}};
async function api(url,body,method=body===undefined?'GET':'POST'){let r;try{r=await fetch(url,{method,headers:body===undefined?{}:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})}catch{throw Error('Cannot connect to the local API. Run “npm start” from art-manager and open http://127.0.0.1:8765/ instead of using Live Server.')};if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('This page is not connected to the Art Manager API. Run “npm start” from art-manager and open http://127.0.0.1:8765/ instead of using Live Server.');let data;try{data=await r.json()}catch{throw Error('The local API returned an invalid response. Restart the manager with “npm start” from art-manager.')};if(!r.ok)throw Error(data.error||'The operation failed.');return data}
function say(text){message.textContent=text}
async function refresh(){try{const {artworks,defaultAuthor}=await api('/api/artworks');$('#author').value=$('#author').value||defaultAuthor;$('#count').textContent=`${artworks.length} artwork entries`;grid.replaceChildren();if(!artworks.length){grid.innerHTML='<div class="empty">No artwork yet. Import the existing gallery or add an image.</div>';return}for(const art of artworks){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=art.thumbnail;img.alt=`Artwork ${art.id}`;img.loading='lazy';const meta=document.createElement('div');meta.className='meta';const title=document.createElement('strong');title.textContent=art.author;const details=document.createElement('small');details.textContent=`ID: ${art.id} · ${art.src}`;const date=document.createElement('small');date.textContent=`Added: ${new Date(art.timestamp_added).toLocaleDateString('en-GB')}${art.created_at?` · Created: ${art.created_at}`:''}`;const actions=document.createElement('div');actions.className='actions';const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.setAttribute('aria-label',`Delete artwork ${art.id}`);del.onclick=async()=>{if(!confirm(`Delete artwork ${art.id}? Its managed image will be moved to the private trash folder.`))return;try{const {result}=await api('/api/delete',{id:art.id});say(result.movedToTrash?'Artwork deleted; its image was moved to the private trash folder.':'Artwork deleted; the shared or unmanaged image was kept.');await refresh()}catch(e){say(e.message)}};actions.append(del);meta.append(title,details,date,actions);card.append(img,meta);grid.append(card)}}catch(e){say(e.message)}}
$('#refresh').onclick=refresh;
$('#add-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const f=new FormData(form);try{const {artwork}=await api('/api/add',{sourcePath:f.get('sourcePath'),author:f.get('author'),createdAt:f.get('createdAt')});say(`Added artwork ${artwork.id}. Export to publish it on the website.`);form.reset();await refresh()}catch(err){say(err.message)}};
$('#import').onclick=async()=>{if(!confirm('Import entries from public/data/arts.json? Existing records will not be duplicated.'))return;try{const {report}=await api('/api/import',{});const details=report.invalid.slice(0,8).map(item=>`\n${item.src||`record ${item.index+1}`}: ${item.reason}`).join('');say(`Import complete: ${report.imported} added, ${report.alreadyPresent} already in the database, ${report.invalid.length} invalid.${details}${report.invalid.length>8?`\n...and ${report.invalid.length-8} more errors.`:''}`);await refresh()}catch(e){say(e.message)}};
$('#backup').onclick=async()=>{try{const {backups}=await api('/api/backup',{});say(`Backups created: ${backups.json.split(/[\\/]/).pop()} and ${backups.database.split(/[\\/]/).pop()}.`)}catch(e){say(e.message)}};
$('#export').onclick=async()=>{if(!confirm('Replace public/data/arts.json with the database contents? The previous JSON will be backed up in art-manager/backups.'))return;try{const {count,jsonBackup}=await api('/api/export',{});say(`Exported ${count} entries. ${jsonBackup?`Previous JSON backed up as ${jsonBackup.split(/[\\/]/).pop()}.`:'No previous JSON file was present to back up.'} public/data/arts.json is ready to deploy.`)}catch(e){say(e.message)}};
refresh();
</script>
</body>
</html>
